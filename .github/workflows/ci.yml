name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: Typecheck, lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No Supabase configuration on purpose. Nothing should need a reachable
      # backend to render, and a build that breaks without one would break the
      # prerender pass in production too.
      - run: npm run build

      # Next only picks up middleware beside the app directory. With src/app
      # that means src/middleware.ts; at the repo root it is silently ignored,
      # which is how the auth guard and session refresh went missing for three
      # milestones without a single failing test.
      - name: Check the middleware is actually registered
        run: |
          entries=$(node -e "
            const m = require('./.next/server/middleware-manifest.json');
            console.log(Object.keys(m.middleware || {}).length);
          ")
          if [ "$entries" = "0" ]; then
            echo "No middleware registered. It must live at src/middleware.ts,"
            echo "beside src/app — at the repo root Next ignores it silently."
            exit 1
          fi
          echo "Middleware is registered."

      - name: Check the crypto engine stayed out of the page bundles
        run: |
          leaked=$(grep -rl 'argon2id' .next/static/chunks --include='*.js' \
            | grep -v 'fgk-crypto' || true)
          if [ -n "$leaked" ]; then
            echo "Argon2id reached the main thread bundle:"
            echo "$leaked"
            echo "It belongs only in the crypto worker chunk — check for a value"
            echo "import that pulls src/lib/crypto/engine.ts into a page."
            exit 1
          fi
          echo "Argon2id is confined to the worker chunk."

  database:
    name: Schema and row-level security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway database, and the suite creates its own unprivileged role
          # to apply the migrations under. Trust keeps that role connectable
          # without inventing credentials for it.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # run.sh applies the migrations as a role that is neither superuser nor
      # BYPASSRLS. That matters: a superuser owner is exempt from forced
      # row-level security, so running as `postgres` would pass even if the
      # policies were recursive or wide open.
      - name: Run schema and RLS suite
        run: supabase/tests/run.sh localhost 5432
