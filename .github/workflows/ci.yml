name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: Typecheck, lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder

  database:
    name: Schema and row-level security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway database, and the suite creates its own unprivileged role
          # to apply the migrations under. Trust keeps that role connectable
          # without inventing credentials for it.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # run.sh applies the migrations as a role that is neither superuser nor
      # BYPASSRLS. That matters: a superuser owner is exempt from forced
      # row-level security, so running as `postgres` would pass even if the
      # policies were recursive or wide open.
      - name: Run schema and RLS suite
        run: supabase/tests/run.sh localhost 5432
